[package]
name = "brimstone_core"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
doctest = false
path = "lib.rs"

[dependencies]
libc = "0.2"
allocator-api2.workspace = true
bitflags.workspace = true
bumpalo = { workspace = true, features = ["allocator-api2"] }
clap = { workspace = true, features = ["derive"] }
half.workspace = true
hashbrown.workspace = true
indexmap-allocator-api.workspace = true
memchr.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
rand.workspace = true
rustc-hash.workspace = true
ryu-js.workspace = true
siphasher.workspace = true
supports-color.workspace = true
temporal_rs = { workspace = true, features = ["float64_representable_durations", "std"] }
timezone_provider = { workspace = true, features = ["tzif"] }
xsum.workspace = true

# Internal crates
brimstone_icu_collections.workspace = true
brimstone_intl_data.workspace = true
brimstone_macros.workspace = true

# ICU4X crates must all be the same version
icu_calendar.workspace = true
icu_casemap.workspace = true
icu_collator.workspace = true
icu_collections.workspace = true
icu_datetime = { workspace = true, features = ["unstable"] }
icu_decimal = { workspace = true, features = ["unstable"] }
icu_experimental.workspace = true
icu_list.workspace = true
icu_locale.workspace = true
icu_locale_fallback.workspace = true
icu_normalizer.workspace = true
icu_pattern.workspace = true
icu_plurals.workspace = true
icu_properties= { workspace = true, features = ["alloc"] }
icu_provider = { workspace = true, features = ["sync"] }
icu_provider_baked.workspace = true
icu_provider_adapters.workspace = true
# `Intl.Segmenter` (ECMA-402 19): the rule-based grapheme, word and sentence segmenters only. The
# workspace pin turns `compiled_data`, `auto` and `lstm` off, so the dictionary and LSTM word-break
# models are not reachable from this build at all; `unstable` is the feature that names the data
# markers and the `try_new_*_unstable` constructors the baked data is loaded through.
icu_segmenter = { workspace = true, features = ["unstable"] }
icu_time.workspace = true
zerotrie.workspace = true
zerovec.workspace = true

# The crates `icu_decimal` renders with
fixed_decimal.workspace = true
writeable.workspace = true

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[features]
default = ["jemalloc"]
# Enable Annex B extensions by default
annex_b = []
# Run the garbage collector in stress test mode
gc_stress_test = []
# Collect handle use statistics
handle_stats = []
# Find handle leaks: report scopes dropped without exit and sample where handles are made outside any scope (diagnostic builds)
handle_leak_trace = []
# Use the jemalloc allocator
jemalloc = []
# Do not use the jemalloc allocator, overrides the `jemalloc` feature
no_jemalloc = []
# Return allocation errors instead of panicking
alloc_error = []
# Enable features only available on nightly (e.g. never_type)
nightly = []

[lints]
workspace = true

