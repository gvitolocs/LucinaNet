[package]
name = "brimstone_gc_hook_types"
version.workspace = true
edition.workspace = true
publish = false

# Doc-test-only crate: the compile-fail proofs that a GC hook cannot allocate
# (docs/gc-hooks-cannot-allocate.md). brimstone_core itself has `doctest = false`.
[lib]
path = "src/lib.rs"
doctest = true

[dependencies]
brimstone_core = { workspace = true, features = ["annex_b", "alloc_error"] }
