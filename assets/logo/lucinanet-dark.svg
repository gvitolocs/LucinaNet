<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t d">
  <title id="t">LucinaNet</title>
  <desc id="d">The LucinaNet mark for a dark background: a violet ray bent inside a light glass tile, passing a violet point of light.</desc>
  <!-- Dark-background variant: the block inverted to the light state of the adaptive glass. Tile PAPER #f2f2f7 with
       GLASS_RIM_LIGHT black at 0.18 (16.2:1 against GROUND_DARK #16161b); ray and point of light become ACCENT_FILL
       #4a5bb5 (5.5:1 inside the tile), so the violet stays in the mark and only the tile colour separates the two
       variants. -->
  <rect x="4" y="4" width="56" height="56" rx="18" fill="#f2f2f7"/>
  <rect x="4" y="4" width="56" height="56" rx="18" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="46" cy="17" r="9.35" fill="#4a5bb5"/>
  <g fill="none" stroke="#4a5bb5" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 19 L33 29 L51 47"/>
    <path d="M13 36 L26 42.5" stroke-opacity="0.55"/>
  </g>
</svg>
