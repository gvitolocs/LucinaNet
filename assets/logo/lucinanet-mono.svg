<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t d">
  <title id="t">LucinaNet</title>
  <desc id="d">The LucinaNet mark alone, one colour taken from the surrounding text: a ray of light bent once, passing a point of light.</desc>
  <!-- Monochrome variant: no tile, three separate shapes — the bent ray, its ghost beam at 0.55 and the point of
       light — all in currentColor. The disc stays its own shape, 5.64 units of clear space from the nearest leg of
       the ray, so it never merges with the bend at any size. -->
  <path d="M13 19 L33 29 L51 47" fill="none" stroke="currentColor" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M13 36 L26 42.5" fill="none" stroke="currentColor" stroke-width="5.4" stroke-opacity="0.55" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="46" cy="17" r="9.35" fill="currentColor"/>
</svg>
