# Copied from servo/.cargo/config.toml: this workspace builds Servo's crates from outside its root,
# so its [env] does not apply by itself.
[env]
RUSTC_BOOTSTRAP = "crown,script,script_webcrypto,script_webgpu,script_bindings,style_tests,mozjs,mozjs_sys"
SERVO_STYLE_THREAD_STACK_SIZE_KB = "8192"

# The harness build (docs/harness-doors.md): tools/build-harness.sh prints and runs the same command.
[alias]
build-harness = "build --profile probe -p lucinanet-servo --features desktop,media,harness"
