[package]
name = "sitejs"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli", "json"] }
scraper = "0.24"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
debug = false

# Standalone tool: not a member of the LucinaNet workspace.
[workspace]
