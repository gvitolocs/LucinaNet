[package]
name = "t262"
version = "0.1.0"
edition = "2021"
description = "test262 runner written against the mozjs crate API"

[dependencies]
mozjs = { path = "../../mozjs", default-features = false, features = ["intl", "libz-sys"] }
mozjs_sys = { path = "../../mozjs-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[profile.release]
debug = false

[workspace]

# mozjs_sys (the Rust backend) takes this fork of indexmap from git, as the repo workspace does.
[patch.crates-io]
indexmap-allocator-api = { path = "../../../third_party/indexmap-allocator-api" }

