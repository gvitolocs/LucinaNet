<!doctype html>
<meta charset="utf-8">
<title>OOM in a dedicated worker</title>
<body>
<p>Exhausts a capped JS heap inside a dedicated worker's message handler and its microtasks, so
the worker thread's context is poisoned inside a worker task. The worker is a data: URL, since a
file: page may not load a file: or blob: worker.
<script>
var src = "var keep = [];" +
  "onmessage = function () {" +
  "  for (var i = 0; i < 20000; i++) {" +
  "    keep.push({ a: 'x'.repeat(256), b: [i, i + 1, i + 2], c: function () { return i; } });" +
  "  }" +
  "  Promise.resolve().then(function () { postMessage('more'); });" +
  "};";
var worker = new Worker("data:text/javascript," + encodeURIComponent(src));
worker.onmessage = function () { worker.postMessage("grow"); };
worker.postMessage("grow");
</script>
</body>
