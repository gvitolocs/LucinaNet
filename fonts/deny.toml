# cargo-deny policy for the LucinaNet fonts crates: only permissive licences, MPL-2.0 and the FreeType License.

[graph]
all-features = true

[advisories]
# Unmaintained or yanked crates are errors too; add exceptions here with a reason.
yanked = "deny"
ignore = []

[licenses]
# Permissive licences, MPL-2.0 (this repository), FTL (FreeType-derived lucina-ftcompat).
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Zlib", "MPL-2.0", "Unicode-3.0", "FTL"]
confidence-threshold = 0.9
# Our own crates are unpublished; see LICENSE and NOTICE.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
