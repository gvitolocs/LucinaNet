[package]
name = "lucinanet-historydb"
version = "0.1.0"
description = "Visited-page store with Firefox frecency and history queries (pure, in memory)"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only the profile seeder example (examples/seed-profile.rs) needs both stores; the crate itself stays
# dependency-free of bookmarks, and nothing that ships changes.
[dev-dependencies]
lucinanet-bookmarks = { path = "../lucinanet-bookmarks" }
